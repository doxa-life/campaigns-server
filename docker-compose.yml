services:
  mailhog:
    image: mailhog/mailhog:latest
    container_name: base-mailhog
    ports:
      - "1025:1025"  # SMTP server
      - "8025:8025"  # Web UI
    environment:
      MH_STORAGE: memory
    restart: unless-stopped
    networks:
      - base-network

  db:
    image: postgres:18.6
    restart: always
    environment:
      POSTGRES_PASSWORD: example

networks:
  base-network:
    driver: bridge